name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build demo
        run: npm run build:demo

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Drives the built page against a fake OpenAI-compatible endpoint and
      # inspects the request body, which is where the conversation-history
      # bugs hide — they are invisible from the UI.
      - name: End-to-end test
        run: npm run test:e2e
