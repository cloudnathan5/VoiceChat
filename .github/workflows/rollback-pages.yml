# Temporary diagnostic workflow.
#
# Publishes the June 17 deployment (552e787) byte-for-byte so a provider can be
# retested against the exact code that was live then. Deploys the committed
# demo/ tree from that commit rather than building, because that build output is
# what was actually served.
#
# Delete this file once the question it exists to answer is settled. Re-running
# "Deploy to GitHub Pages" restores the current site.
name: Rollback Pages to June deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the June deploy
        uses: actions/checkout@v4
        with:
          ref: 552e78710f8e481cd1fe4c353f141ec8a84792f1
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload the demo/ tree exactly as it was served
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
