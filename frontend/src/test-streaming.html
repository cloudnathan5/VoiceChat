<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .event { border: 1px solid #ccc; padding: 10px; margin: 5px 0; }
        .token { background-color: #f0f0f0; }
        .error { background-color: #ffdddd; }
        .complete { background-color: #ddffdd; }
    </style>
</head>
<body>
    <h1>Streaming Test</h1>
    <div>
        <input type="text" id="messageInput" placeholder="Enter message" />
        <button onclick="sendMessage()">Send</button>
    </div>
    <div id="events"></div>

    <script>
        async function sendMessage() {
            const message = document.getElementById('messageInput').value;
            const eventsDiv = document.getElementById('events');
            eventsDiv.textContent = '';

            try {
                const response = await fetch('/api/threads/8289dcde-c5fe-40f4-bd1f-2e999f70b58c/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: message,
                        role: 'user',
                        providerId: '0f0b5793-606c-4988-b6db-4aabcc8d8436',
                        modelId: 'test',
                        stream: true
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('event: ')) {
                            const eventType = line.slice(7);
                            const nextLine = lines[lines.indexOf(line) + 1];

                            if (nextLine && nextLine.startsWith('data: ')) {
                                const data = nextLine.slice(6);
                                const eventDiv = document.createElement('div');
                                eventDiv.className = 'event ' + eventType;
                                eventDiv.textContent = `${eventType}: ${data}`;
                                eventsDiv.appendChild(eventDiv);
                            }
                        }
                    }
                }
            } catch (error) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'event error';
                errorDiv.textContent = `Error: ${error.message}`;
                eventsDiv.appendChild(errorDiv);
            }
        }
    </script>
</body>
</html>
